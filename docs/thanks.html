<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Thanks for going Plus — Corkly</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="favicon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; min-height:100vh; display:grid; place-items:center; font-family:'Patrick Hand',system-ui,sans-serif; color:#2f2418;
      background:#c9935a radial-gradient(circle at 30% 20%, #d9a46b, #b57d45); padding:16px; box-sizing:border-box; }
    .note { background:#fff6a8; max-width:420px; padding:34px 30px 30px; transform:rotate(-1.5deg); box-shadow:0 14px 30px rgba(0,0,0,.28); position:relative; text-align:center; }
    .note::before { content:''; position:absolute; top:-10px; left:50%; width:22px; height:22px; margin-left:-11px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#ff8a7a,#d33c2c); box-shadow:0 3px 4px rgba(0,0,0,.3); }
    h1 { font-family:'Caveat',cursive; font-size:44px; margin:0 0 8px; }
    p { font-size:19px; line-height:1.45; margin:10px 0; }
    small { display:block; margin-top:18px; opacity:.7; font-size:15px; }
  </style>
</head>
<body>
  <div class="note">
    <h1>You're on Plus! ★</h1>
    <p>Thank you for supporting Corkly. Head back to the app — your Plus perks switch on by themselves within a few seconds.</p>
    <p>You can close this tab.</p>
    <small>Receipts and billing are handled by Polar. Manage your plan anytime from Corkly → Settings → Corkly Plus.</small>
  </div>
</body>
</html>
